name: dyar_core
description: Dyar v10 shared core — models, Firebase services, state.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0
  firebase_storage: ^13.4.2
  cloud_functions: ^6.3.2
  flutter_riverpod: ^2.5.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  intl: ">=0.19.0 <0.21.0"
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
