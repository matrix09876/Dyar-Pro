name: dyar_driver
description: Dyar v10 Driver — تطبيق السائق/المندوب (توصيل + تاكسي + طرود).
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dyar_core:
    path: ../../packages/dyar_core
  dyar_ui:
    path: ../../packages/dyar_ui
  firebase_core: ^3.6.0
  flutter_riverpod: ^2.5.1
  google_maps_flutter: ^2.18.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
