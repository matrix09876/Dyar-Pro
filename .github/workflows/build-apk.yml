name: Build User APK

# يبني APK لتطبيق المستخدم (apps/user) ويرفعه كـ artifact تنزّله من تبويب Actions.
# التشغيل: تبويب Actions ← "Build User APK" ← Run workflow (أو عند تعديل apps/user).
#
# متطلّب لمرة واحدة: أضِف Secret باسم GOOGLE_SERVICES_JSON يحتوي محتوى
# google-services.json (لتطبيق Android بحزمة com.dyar.user) من مشروع Firebase.
# Settings ← Secrets and variables ← Actions ← New repository secret.
# ملاحظة: خط البناء مُتحقَّق منه بالكامل (راجع docs/BUILD-APK.md).

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "نوع البناء"
        type: choice
        default: release
        options: [release, debug]
  push:
    branches: ['**']
    paths:
      - 'apps/user/**'
      - 'packages/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_ID: com.dyar.user
      MIN_SDK: '23'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          cache: true

      - name: توليد سقالة android (flutter create)
        working-directory: apps/user
        run: flutter create --platforms=android --org com.dyar --project-name dyar_user .

      - name: ضبط applicationId و minSdk
        working-directory: apps/user/android
        run: |
          set -e
          # دعم Kotlin DSL أو Groovy حسب نسخة Flutter
          if [ -f app/build.gradle.kts ]; then G=app/build.gradle.kts; else G=app/build.gradle; fi
          echo "Gradle file: $G"
          # توحيد applicationId مع اسم الحزمة المسجّل في Firebase
          sed -i -E "s/applicationId(\s*=)?\s*\"[^\"]*\"/applicationId = \"${APP_ID}\"/" "$G" || true
          sed -i -E "s/applicationId(\s*=)?\s*'[^']*'/applicationId '${APP_ID}'/" "$G" || true
          # رفع minSdk لمتطلبات Firebase
          sed -i -E "s/minSdk(Version)?(\s*=)?\s*[A-Za-z0-9_.]+/minSdk = ${MIN_SDK}/" "$G" || true
          echo "----- $G -----"; grep -nE "applicationId|minSdk" "$G" || true

      - name: حقن google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "$GS" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON غير موجود. أضِفه ثم أعد التشغيل."
            exit 1
          fi
          printf '%s' "$GS" > apps/user/android/app/google-services.json
          echo "تم كتابة google-services.json ($(wc -c < apps/user/android/app/google-services.json) بايت)"

      - name: تطبيق إضافة google-services في Gradle
        working-directory: apps/user/android
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            # Kotlin DSL
            grep -q 'com.google.gms.google-services' settings.gradle.kts || \
              sed -i -E 's/(id\("dev.flutter.flutter-plugin-loader"\)[^\n]*)/\1\n    id("com.google.gms.google-services") version "4.4.2" apply false/' settings.gradle.kts
            grep -q 'com.google.gms.google-services' app/build.gradle.kts || \
              sed -i -E 's/(id\("com.android.application"\))/\1\n    id("com.google.gms.google-services")/' app/build.gradle.kts
          else
            # Groovy DSL
            grep -q 'com.google.gms.google-services' settings.gradle || \
              sed -i -E 's/(id "dev.flutter.flutter-plugin-loader"[^\n]*)/\1\n    id "com.google.gms.google-services" version "4.4.2" apply false/' settings.gradle
            grep -q 'com.google.gms.google-services' app/build.gradle || \
              echo "apply plugin: 'com.google.gms.google-services'" >> app/build.gradle
          fi
          echo "----- settings -----"; cat settings.gradle.kts 2>/dev/null || cat settings.gradle
          echo "----- app plugins -----"; grep -nE "google-services|com.android.application" app/build.gradle.kts 2>/dev/null || grep -nE "google-services" app/build.gradle
          # تأكّد أنّ الحقن نجح فعلاً (وإلا فشل واضح بدل بناء بلا Firebase)
          S=$( [ -f settings.gradle.kts ] && echo settings.gradle.kts || echo settings.gradle )
          A=$( [ -f app/build.gradle.kts ] && echo app/build.gradle.kts || echo app/build.gradle )
          grep -q 'com.google.gms.google-services' "$S" && grep -q 'com.google.gms.google-services' "$A" \
            || { echo "::error::فشل حقن إضافة google-services في Gradle — راجع anchors التصحيح."; exit 1; }

      - name: جلب الحزم
        working-directory: apps/user
        run: flutter pub get

      - name: بناء الـ APK
        working-directory: apps/user
        run: flutter build apk --${{ github.event.inputs.build_mode || 'release' }}

      - name: رفع الـ APK كـ artifact
        uses: actions/upload-artifact@v7
        with:
          name: dyar-user-apk
          path: apps/user/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
