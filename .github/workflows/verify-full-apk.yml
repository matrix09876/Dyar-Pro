name: Verify Full APK Pipeline

# تحقّق مؤقّت: يثبت أنّ خط البناء الكامل (حقن google-services + إضافة Gradle +
# البناء) يعمل، باستخدام google-services.json وهمي (بلا secret، مشروع غير حقيقي).
# إن نجح ⇒ build-apk.yml الحقيقي سينجح بمجرّد إضافة سرّك. يُحذف هذا الملف بعد التأكيد.

on:
  workflow_dispatch: {}
  push:
    branches: ['**']
    paths:
      - '.github/workflows/verify-full-apk.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ID: com.dyar.user
      MIN_SDK: '23'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          cache: true

      - name: توليد سقالة android
        working-directory: apps/user
        run: flutter create --platforms=android --org com.dyar --project-name dyar_user .

      - name: ضبط applicationId و minSdk
        working-directory: apps/user/android
        run: |
          set -e
          if [ -f app/build.gradle.kts ]; then G=app/build.gradle.kts; else G=app/build.gradle; fi
          sed -i -E "s/applicationId(\s*=)?\s*\"[^\"]*\"/applicationId = \"${APP_ID}\"/" "$G" || true
          sed -i -E "s/applicationId(\s*=)?\s*'[^']*'/applicationId '${APP_ID}'/" "$G" || true
          sed -i -E "s/minSdk(Version)?(\s*=)?\s*[A-Za-z0-9_.]+/minSdk = ${MIN_SDK}/" "$G" || true
          grep -nE "applicationId|minSdk" "$G" || true

      - name: كتابة google-services.json وهمي (بدل الـ secret)
        run: |
          cat > apps/user/android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "demo-dyar",
              "storage_bucket": "demo-dyar.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.dyar.user" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDEMO-DEMO-DEMO-DEMO-DEMO-DEMO0000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "wrote dummy google-services.json"

      - name: تطبيق إضافة google-services في Gradle
        working-directory: apps/user/android
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            grep -q 'com.google.gms.google-services' settings.gradle.kts || \
              sed -i -E 's/(id\("dev.flutter.flutter-plugin-loader"\)[^\n]*)/\1\n    id("com.google.gms.google-services") version "4.4.2" apply false/' settings.gradle.kts
            grep -q 'com.google.gms.google-services' app/build.gradle.kts || \
              sed -i -E 's/(id\("com.android.application"\))/\1\n    id("com.google.gms.google-services")/' app/build.gradle.kts
          else
            grep -q 'com.google.gms.google-services' settings.gradle || \
              sed -i -E 's/(id "dev.flutter.flutter-plugin-loader"[^\n]*)/\1\n    id "com.google.gms.google-services" version "4.4.2" apply false/' settings.gradle
            grep -q 'com.google.gms.google-services' app/build.gradle || \
              echo "apply plugin: 'com.google.gms.google-services'" >> app/build.gradle
          fi
          S=$( [ -f settings.gradle.kts ] && echo settings.gradle.kts || echo settings.gradle )
          A=$( [ -f app/build.gradle.kts ] && echo app/build.gradle.kts || echo app/build.gradle )
          grep -q 'com.google.gms.google-services' "$S" && grep -q 'com.google.gms.google-services' "$A" \
            || { echo "::error::فشل حقن إضافة google-services في Gradle"; exit 1; }
          echo "----- $S -----"; cat "$S"
          echo "----- $A (plugins) -----"; grep -nE "plugins|google-services|com.android.application|kotlin" "$A" | head

      - name: جلب الحزم
        working-directory: apps/user
        run: flutter pub get

      - name: بناء APK (إثبات الأنبوب الكامل)
        working-directory: apps/user
        run: flutter build apk --release

      - name: رفع APK التحقّق
        uses: actions/upload-artifact@v4
        with:
          name: dyar-user-apk-fullpipeline-test
          path: apps/user/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
