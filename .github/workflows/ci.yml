name: Dyar v10 CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci && npm run build
        working-directory: dashboard

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/functions/package-lock.json }
      - run: npm ci && npm run build
        working-directory: backend/functions

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Analyze all packages & apps
        run: |
          for d in packages/dyar_core packages/dyar_ui apps/user apps/driver apps/partner; do
            (cd "$d" && flutter pub get && flutter analyze)
          done
